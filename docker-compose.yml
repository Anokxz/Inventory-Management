version: '3.9'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "5000"
      DB_HOST: db
      DB_USER: root
      DB_PASSWD: example
      DB_NAME: mini
      DB_PORT: "3306"
    volumes:
      - .:/app:delegated
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.1
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: mini
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
